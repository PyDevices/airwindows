[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipython-airwindows"
dynamic = ["version"]
description = "Chris Johnson's Airwindows plug-ins as audiodsp audio nodes for CPython and MicroPython"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "third_party/airwindows/LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydevices-audiodsp>=0.6.10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/PyDevices/airwindows"
Source = "https://github.com/PyDevices/airwindows"
Documentation = "https://github.com/PyDevices/airwindows/blob/main/docs/index.md"
Issues = "https://github.com/PyDevices/airwindows/issues"

[tool.setuptools]
package-dir = {"" = "src/cpython"}
py-modules = ["audioairwindows"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-* cp315t-*"
# 3.15 and its free-threaded build on the desktops only: Android and Pyodide
# have no 3.15 users yet.
skip = "*musllinux* *-win32 cp315*-android_* cp315*-pyodide_*"
# Each wheel installs into a clean environment with audiodsp beside it and
# renders PurestDrive. audiodsp's wheels for 3.15 aren't on PyPI yet, so those
# two builds are compiled and packaged but not run.
test-command = "python {project}/examples/audioairwindows_simpletest.py"
test-skip = "cp315-* cp315t-* *-pyodide_* *-android_*"

# auto64 is the runner's own 64-bit architecture: x86_64 on an x86_64 runner,
# aarch64 on an ARM one, so one setting serves both.
[tool.cibuildwheel.linux]
archs = ["auto64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

# arm64 only, matching the runner: an x86_64 wheel built there couldn't run
# its test.
[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.android]
archs = ["arm64_v8a", "x86_64"]
environment = { ANDROID_API_LEVEL = "21" }

[[tool.cibuildwheel.overrides]]
select = "*-android_*"
build-frontend = "build"
