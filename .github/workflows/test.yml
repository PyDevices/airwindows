name: test

# Each change runs the jobs that cover what it changed: tools/ci_scope.py reads
# the diff and says which. A change to documentation alone runs nothing. A pull
# request runs the cpython job on 3.12 alone unless the C sources, the packaging
# or the pins changed. A push to main is scoped to what that push changed, and
# runs the reference job for the plug-ins whose kernels changed (all of them when
# the generator, the shared headers, the harness or the pins changed). A manual
# run, or a push with no earlier commit to compare with, runs everything.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE'
      - '!NOTICE'
      - '!**/LICENSE'
      - 'docs/reference/plugins.md'
  pull_request:
    # The same list as for push.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE'
      - '!NOTICE'
      - '!**/LICENSE'
      - 'docs/reference/plugins.md'
  workflow_dispatch:

# A newer commit on a pull request replaces the run for the older one. Pushes to
# main are never cancelled: each is checked only for its own changes.
concurrency:
  group: test-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cpython: ${{ steps.scope.outputs.cpython }}
      versions: ${{ steps.scope.outputs.versions }}
      micropython: ${{ steps.scope.outputs.micropython }}
      reference: ${{ steps.scope.outputs.reference }}
      plugins: ${{ steps.scope.outputs.plugins }}
      shards: ${{ steps.scope.outputs.shards }}
      shard_count: ${{ steps.scope.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci_scope.py --event "$EVENT" --base "$BASE" --github

  cpython:
    needs: scope
    if: needs.scope.outputs.cpython == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ${{ fromJSON(needs.scope.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the pins from DEPENDENCIES.lock
        id: pins
        run: |
          awk '!/^#/ && NF { print $1 "=" $3 }' DEPENDENCIES.lock >> "$GITHUB_OUTPUT"
      - name: Upstream's source, at the pin
        uses: actions/checkout@v4
        with:
          repository: airwindows/airwindows
          ref: ${{ steps.pins.outputs.airwindows }}
          path: .cache/airwindows-upstream
          sparse-checkout: plugins/LinuxVST/src
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: The committed code is what the generator writes
        run: |
          python -m tools.awgen
          git diff --exit-code
      - name: Install
        run: |
          python -m pip install setuptools numpy flake8 "pydevices-audiodsp>=0.6.10"
          python -m pip install --no-build-isolation .
      - name: Lint
        run: python -m flake8 --select=E9,F63,F7,F82,F401,F841 src tests tools examples
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Ten generated kernels against upstream's own code, with planted faults
        if: matrix.python == '3.12'
        run: python -m unittest discover -s tests -p 'check_*.py' -v
      - name: The simpletest runs
        run: python examples/audioairwindows_simpletest.py
      - name: Built with the fast path on, as ESP32-S3 firmware is, it renders the recorded bytes
        run: |
          rm -rf build
          AW_FAST_DEFAULT=1 python -m pip install --no-build-isolation --force-reinstall --no-deps .
          python -c "import audioairwindows; assert audioairwindows.FAST"
          python tests/test_audioairwindows.py
      - name: Built with the fast path in fixed point, as ESP32-S3 firmware is, it renders the recorded bytes
        run: |
          rm -rf build
          AW_FAST_DEFAULT=1 AW_FIXED=1 python -m pip install --no-build-isolation --force-reinstall --no-deps .
          python -c "import audioairwindows; assert audioairwindows.FIXED"
          python tests/test_audioairwindows.py

  # The plug-ins a change reaches against upstream, on a push to main or by
  # hand. Every plug-in is about 530 builds of upstream's C++, shared across
  # eight runners; one changed kernel is one build on one runner.
  reference:
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.reference != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the pins from DEPENDENCIES.lock
        id: pins
        run: |
          awk '!/^#/ && NF { print $1 "=" $3 }' DEPENDENCIES.lock >> "$GITHUB_OUTPUT"
      - name: Upstream's source, at the pin
        uses: actions/checkout@v4
        with:
          repository: airwindows/airwindows
          ref: ${{ steps.pins.outputs.airwindows }}
          path: .cache/airwindows-upstream
          sparse-checkout: plugins/LinuxVST/src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PLUGINS is empty when every plug-in is checked.
      - name: Shard ${{ matrix.shard }} of ${{ needs.scope.outputs.shard_count }}, within the bar, with planted faults
        env:
          PLUGINS: ${{ needs.scope.outputs.plugins }}
        run: python tests/reference/check.py --faults --jobs 4 --shard ${{ matrix.shard }}/${{ needs.scope.outputs.shard_count }} $PLUGINS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-${{ matrix.shard }}
          path: tests/reference/results.json

  micropython:
    needs: scope
    if: needs.scope.outputs.micropython == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: modules/airwindows
      - name: Read the pins from DEPENDENCIES.lock
        id: pins
        run: |
          awk '!/^#/ && NF { print $1 "=" $3 }' modules/airwindows/DEPENDENCIES.lock >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: PyDevices/audiodsp
          ref: ${{ steps.pins.outputs.audiodsp }}
          path: modules/audiodsp
      - uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ steps.pins.outputs.micropython }}
          path: micropython
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the unix port with audiodsp and this module
        run: |
          ./modules/audiodsp/scripts/fetch_deps.sh
          make -C micropython/mpy-cross -j4
          make -C micropython/ports/unix submodules
          make -C micropython/ports/unix -j4 USER_C_MODULES=$GITHUB_WORKSPACE/modules
      - name: Install the CPython side
        run: |
          python -m pip install setuptools numpy "pydevices-audiodsp>=0.6.10"
          python -m pip install --no-build-isolation ./modules/airwindows
      - name: MicroPython renders the same bytes as CPython
        env:
          MICROPYTHON: ${{ github.workspace }}/micropython/ports/unix/build-standard/micropython
        run: python -m unittest modules/airwindows/tests/test_cross_runtime.py -v
      - name: The interpreter test, on MicroPython
        run: ./micropython/ports/unix/build-standard/micropython -X heapsize=8M modules/airwindows/tests/test_audioairwindows.py
      - name: A unix port with the fast path on, as ESP32-S3 firmware is, renders the recorded bytes
        run: |
          make -C micropython/ports/unix -j4 USER_C_MODULES=$GITHUB_WORKSPACE/modules BUILD=build-fast CFLAGS_EXTRA=-DAW_FAST_DEFAULT=1
          ./micropython/ports/unix/build-fast/micropython -c "import audioairwindows; assert audioairwindows.FAST"
          ./micropython/ports/unix/build-fast/micropython -X heapsize=8M modules/airwindows/tests/test_audioairwindows.py
      - name: A unix port with the fast path in fixed point, as ESP32-S3 firmware is, renders the recorded bytes
        run: |
          make -C micropython/ports/unix -j4 USER_C_MODULES=$GITHUB_WORKSPACE/modules BUILD=build-fixed CFLAGS_EXTRA="-DAW_FAST_DEFAULT=1 -DAW_FIXED=1"
          ./micropython/ports/unix/build-fixed/micropython -c "import audioairwindows; assert audioairwindows.FIXED"
          ./micropython/ports/unix/build-fixed/micropython -X heapsize=8M modules/airwindows/tests/test_audioairwindows.py
      - name: The simpletest and the revision stamp, on MicroPython
        run: |
          ./micropython/ports/unix/build-standard/micropython -X heapsize=8M modules/airwindows/examples/audioairwindows_simpletest.py | tee simpletest.out
          ! grep -q ' unknown$' simpletest.out
