name: wheel proof (temporary)
on:
  pull_request:
    paths: ['.github/workflows/wheel-proof.yml', 'pyproject.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: PyDevices/.github/.github/workflows/reusable-build-native-and-wasm-wheels.yml@publishing-v21
    with:
      distribution-name: omnipython-airwindows
      wheel-filename-prefix: omnipython_airwindows
      expected-wheel-count: 30
      linux-aarch64: true
      release-ref: ${{ github.head_ref || github.ref_name }}
      version: "0.1.0"
