# The type stub: mypy reads it, and stubtest imports audioairwindows under CPython and
# fails when the stub and the code disagree about a name or a signature. A sample a user
# would write must pass, and one with a planted error must fail. Runs when the stub, the
# generator behind it or this file changes. About a minute.
name: Stubs

on:
  push:
    branches: [main]
    paths:
      - 'stubs/**'
      - 'tools/awgen/**'
      - 'tools/check_stubs.py'
      - '.github/workflows/stubs.yml'
  pull_request:
    paths:
      - 'stubs/**'
      - 'tools/awgen/**'
      - 'tools/check_stubs.py'
      - '.github/workflows/stubs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stubs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # stubtest imports the module, so the published wheel is the runtime side; it
      # brings audiodsp, whose own stubs the samples read.
      - run: >
          python -m pip install mypy --pre
          -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/
          omnipython-airwindows
      - run: python tools/check_stubs.py
